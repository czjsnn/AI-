<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI问诊提示词生成器</title>
<style>
  body{font-family:system-ui;max-width:900px;margin:20px auto;padding:0 15px}
  .field{margin:10px 0}
  label{display:block;font-weight:bold;margin-bottom:4px}
  input[type="text"]{width:100%;padding:5px;border:1px solid #ccc;border-radius:4px;box-sizing:border-box}
  table{width:100%;border-collapse:collapse;margin-top:10px}
  th, td{border:1px solid #999;padding:4px}
  th{background:#eef;font-size:14px}
  td input{width:100%;border:none;padding:2px;box-sizing:border-box}
  td input:focus{outline:none;background:#f9f9f9}
  .btn{margin-top:15px;padding:8px 16px;font-size:15px;background:#1677ff;color:#fff;border:none;border-radius:6px;cursor:pointer}
  .btn:hover{background:#0f5fd4}
  .add-btn{background:#f0f0f0;color:#333;margin-left:5px}
</style>
</head>
<body>

<h3>AI问诊提示词生成器</h3>
<p>填写患者信息和症状后，点击“生成并复制”，再粘贴到AI对话框即可。</p>

<div class="field"><label>姓名</label><input type="text" id="name" value="患者A"></div>
<div class="field"><label>年龄</label><input type="text" id="age"></div>
<div class="field"><label>性别</label><input type="text" id="sex"></div>
<div class="field"><label>职业</label><input type="text" id="job"></div>

<div style="margin-top:20px">
  <label>症状列表（按顺序填写）</label>
  <table id="symptomTable">
    <thead>
      <tr>
        <th>症状</th>
        <th>部位</th>
        <th>开始时间</th>
        <th>持续/阵发</th>
        <th>发作频率</th>
        <th>每次持续时间</th>
        <th>加重因素</th>
        <th>缓解因素</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <button class="btn add-btn" onclick="addRow()">+ 添加一行</button>
</div>

<div style="margin-top:15px">
  <button class="btn" onclick="generate()">生成并复制</button>
</div>

<!-- 原始模板（修改后） -->
<textarea id="template" style="display:none">
你是一位经验丰富的全科医生，擅长鉴别诊断与循证医学，能够结合高风险人群特征进行分层决策。
【全局约束】
严格遵循2023年后的临床指南或权威共识。
对每一个关键结论，请注明证据来源（如《中华医学杂志》、WHO指南等）和证据等级（A级推荐/专家共识/病例报告）。请尽量在回答末尾附上参考资料的原始链接。在你不确定或存在医学争议的地方，请明确说“这一点存在不确定性”，并解释分歧在哪里。本对话中的所有提问，均为分步骤诊断流程。你只允许输出当前步骤要求的内容。即使是出于关心或完整性考虑，也不允许主动提及、预告、补充任何后续步骤的信息。回答时不得解释“我为什么只回答这部分”。
【流程设定】
严格按照以下步骤执行。每次只输出当前步骤内容，不得提前透露后续步骤；当用户完成当前步骤的回答后，你自动进入下一步，如果你当前步骤没有向用户输出问题，你则询问用户是否进入下一步，无需用户提供任何额外指令。请详细地解答，不要省略任何步骤。
第一步：在后台形成初步疾病谱排序（不要展示），然后针对风险最高且最可干预的3-5个方向，提出需补充的阴性症状或病史信息，以表格列出（格式：有无XX，标明鉴别意义），最后提示用户回答格式为（以上都无/除有xxx外以上都无）。
→ 等待用户回答。
第二步：根据用户回答，更新后台疾病谱排序（不展示），然后告知优先鉴别的诊断（按可能性排序），并写出诊断依据（包含高可能性的支持依据、低可能性的排除缘由、相邻排序的对比解释）。
第三步：给出基于家庭医疗的下一步行动计划。
第四步：给出基于循证医学的下一步行动计划。
（注意：第二、三、四步在用户回答后可连续输出，无需用户再发指令。）

接下来我会给你一位患者的基本信息
这是一位患者的基本信息
患者{{姓名}}
年龄：{{年龄}}
性别：{{性别}}
职业：{{职业}}
以下症状按——症状、部位、开始时间、持续/阵发、发作频率、每次持续时间、加重因素、缓解因素 的顺序填写：
{{症状列表}}
</textarea>

<script>
  window.onload = function(){
    for(let i=0;i<5;i++) addRow();
  };

  function addRow(){
    const tbody = document.querySelector('#symptomTable tbody');
    const tr = document.createElement('tr');
    const columns = ['symptom','location','start','pattern','frequency','duration','aggravating','relieving'];
    columns.forEach(col => {
      const td = document.createElement('td');
      const input = document.createElement('input');
      input.type = 'text';
      input.dataset.col = col;
      td.appendChild(input);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  }

  function generate(){
    let t = document.getElementById('template').value;
    t = t.replaceAll('{{姓名}}', document.getElementById('name').value.trim());
    t = t.replaceAll('{{年龄}}', document.getElementById('age').value.trim());
    t = t.replaceAll('{{性别}}', document.getElementById('sex').value.trim());
    t = t.replaceAll('{{职业}}', document.getElementById('job').value.trim());

    const rows = document.querySelectorAll('#symptomTable tbody tr');
    let symptomLines = [];
    let idx = 1;

    rows.forEach(row => {
      const inputs = row.querySelectorAll('input');
      const values = Array.from(inputs).map(inp => inp.value.trim());
      if(values[0] === '') return;

      const [symptom, location, start, pattern, frequency, duration, aggravating, relieving] = values;
      const line = `症状${idx}：${symptom}；部位：${location}；开始时间：${start}；持续/阵发：${pattern}；发作频率：${frequency}；每次持续时间：${duration}；加重因素：${aggravating}；缓解因素：${relieving}`;
      symptomLines.push(line);
      idx++;
    });

    t = t.replaceAll('{{症状列表}}', symptomLines.length ? symptomLines.join('\n') : '无');

    const ta = document.createElement('textarea');
    ta.value = t;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);

    alert('已复制！请粘贴到AI对话框。');
  }
</script>

</body>
</html>
